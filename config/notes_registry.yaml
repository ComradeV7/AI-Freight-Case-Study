      - Chennai-Bangalore
    effective_from: "2025-02-24"
    effective_to: "2025-03-08"
    polarity: causes_rise
    source_text: "Heavy flooding on the Chennai-Bangalore highway disrupted normal truck movement from Feb 24 to Mar 8, forcing longer detours and higher trip costs. Roads were passable again by Mar 9."
